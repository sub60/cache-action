name: "sub60's cache action"

description: "Sets up and drains the sub60 Nix cache uploader"

inputs:
  auth-token:
    description: "The authentication token used to push store paths"
    required: true
  github-token:
    description: "GitHub token used to download release artifacts"
    required: false

runs:
  using: "node24"
  main: "js/main.js"
  post: "js/post.js"
