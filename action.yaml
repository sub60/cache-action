name: "sub60's cache action"

description: "Sets up and drains the sub60 Nix cache uploader"

inputs:
  user:
    description: "The sub60 cache user"
    required: false
    default: ${{ github.repository_owner }}
  cache:
    description: "The sub60 cache name"
    required: false
    default: ${{ github.event.repository.name }}
  auth-token:
    description: "The authentication token used to push store paths"
    required: true
  upstream-caches:
    description: "Space/newline-separated binary cache URLs whose store paths should not be pushed. Use 'none' to clear the default"
    required: false
  github-token:
    description: "GitHub token used to download release artifacts from private repos"
    required: false
  action-ref:
    description: "The cache-action release tag to download when using a vendored checkout"
    required: false

runs:
  using: "composite"
  steps:
    - uses: ./js
      with:
        auth-token: ${{ inputs.auth-token }}
        github-token: ${{ inputs.github-token }}
        action-ref: ${{ inputs.action-ref }}
        user: ${{ inputs.user }}
        cache: ${{ inputs.cache }}
        upstream-caches: ${{ inputs.upstream-caches }}
      env:
        GITHUB_ACTION_REF: ${{ github.action_ref }}
        GITHUB_ACTION_REPOSITORY: ${{ github.action_repository }}
