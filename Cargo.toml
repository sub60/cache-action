[package]
name = "cache-action"
version = "0.0.10"
edition = "2024"

[dependencies]
async-compat = "0.2"
bytes = "1"
clap = { version = "4.5.38", features = ["derive"] }
either = "1"
flume = { version = "0.12" }
futures = { version = "0.3" }
memchr = "2"
nix = { version = "0.31", features = ["process"] }
nix-types = { git = "ssh://git@github.com/sub60/nix-types.git" }
# Store-only for now: the top-level `nixb` crate currently pulls in the C++
# expression bindings, which drags `nix-expr` and `nix-fetchers` into the
# static link closure.
nixb-store = { path = "../../noib3/nixb/crates/nixb-store", features = ["nix-2-34"] }
pin-project-lite = "0.2"
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls",
] }
smol_str = "0.3.6"
tokio = { version = "1", default-features = false, features = [
  "io-std",
  "io-util",
  "net",
  "rt-multi-thread",
] }
url = "2"

[build-dependencies]
pkg-config = "0.3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = "symbols"
