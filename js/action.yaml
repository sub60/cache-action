name: "cache action runtime"

inputs:
  auth-token:
    required: true
  github-token:
    required: false
  release-repository:
    required: false
  action-ref:
    required: false
  user:
    required: true
  cache:
    required: true
  upstream-caches:
    required: false

runs:
  using: "node24"
  main: "main.js"
  post: "post.js"
  post-if: "always() && env.SUB60_SETUP_CACHE_STARTED == 'true'"
