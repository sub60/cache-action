name: Publish Release Artifacts

on:
  push:
    branches:
      - main
    tags:
      - "*"

jobs:
  build:
    name: Build for ${{ matrix.package }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - package: aarch64-linux
            runner: ubuntu-latest
          - package: x86_64-linux
            runner: ubuntu-latest
          - package: aarch64-darwin
            runner: macos-14
          - package: x86_64-darwin
            runner: macos-14
    steps:
      - uses: actions/checkout@v6

      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@v34
        with:
          nix_version: 2.29.2

      - name: Build package
        run: nix build ".#${{ matrix.package }}"

      - name: Stage artifact
        run: cp result/bin/cache-action "cache-action-${{ matrix.package }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: cache-action-${{ matrix.package }}
          path: cache-action-${{ matrix.package }}
          if-no-files-found: error

  publish:
    name: Publish release artifacts
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: cache-action-*
          path: dist
          merge-multiple: true

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          IS_PRERELEASE: ${{ github.ref_type != 'tag' }}
        run: |
          exists=false
          command=create

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            exists=true
            command=edit
          fi

          args=(
            "$RELEASE_TAG"
            --target "$GITHUB_SHA"
            --title "$RELEASE_TAG"
            --notes ""
          )

          if [ "$IS_PRERELEASE" = "true" ]; then
            args+=(--prerelease)
          else
            args+=(--latest)
          fi

          gh release "$command" "${args[@]}"

      - name: Upload release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" dist/* --clobber
